
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website của Ken</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg,#090d25,#25206b,#111827);
  min-height: 100vh;
  display: grid;
  place-items: center;
}
.container {
  width: 90%;
  max-width: 500px;
  padding: 35px 25px;
  text-align: center;
  border: 1px solid #ffffff30;
  border-radius: 24px;
  background: #ffffff12;
  box-shadow: 0 15px 50px #0005;
}
h1 { color: #9daaff; }
p { color: #d4d8ee; line-height: 1.7; }
button {
  padding: 13px 25px;
  border: 0;
  border-radius: 12px;
  color: white;
  background: linear-gradient(90deg,#6255ff,#a34cff);
  font-size: 16px;
}
</style>
</head>
<body>
<div class="container">
  <h1>WELCOME TO MY WEBSITE</h1>
  <p>Chào mừng bạn đến với website của mình!</p>
  <button onclick="alert('Xin chào!')">
    BẮT ĐẦU
  </button>
</div>
</body>
</html>
